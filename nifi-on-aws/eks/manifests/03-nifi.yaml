# ===========================================================================
#  NiFi as a StatefulSet.
#
#  WHY A STATEFULSET AND NOT A DEPLOYMENT - this is the whole point of EKS
#  for NiFi:
#
#    * Stable pod names: nifi-0, nifi-1, nifi-2. A Deployment gives random
#      suffixes, and NiFi nodes identify each other by hostname.
#    * Stable DNS: nifi-0.nifi-headless.nifi.svc.cluster.local, unchanged
#      across restarts. This is what NIFI_CLUSTER_ADDRESS needs.
#    * A PersistentVolumeClaim that FOLLOWS the pod. If nifi-1 dies and is
#      rescheduled, it gets its OWN disk back, with its in-flight data.
#
#  That last property is the thing that is awkward to arrange on plain EC2,
#  and it is the strongest technical argument for running NiFi on Kubernetes.
# ===========================================================================
apiVersion: v1
kind: Service
metadata:
  name: nifi-headless
  namespace: nifi
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # nodes must find each other WHILE forming
  selector:
    app: nifi
  ports:
    - { name: https,           port: 8443 }
    - { name: cluster,         port: 11443 }
    - { name: load-balance,    port: 6342 }
---
apiVersion: v1
kind: Service
metadata:
  name: nifi
  namespace: nifi
spec:
  selector:
    app: nifi
  ports:
    - { name: https, port: 8443, targetPort: 8443 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nifi-pdb
  namespace: nifi
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: nifi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nifi
  namespace: nifi
spec:
  serviceName: nifi-headless
  replicas: 3
  # OrderedReady, not Parallel: bring nodes up one at a time so the first can
  # win the flow election cleanly. Starting three at once risks a node with an
  # empty flow outvoting the one that has your work.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: nifi }
  template:
    metadata:
      labels: { app: nifi }
    spec:
      imagePullSecrets:
        - name: artifactory-pull
      securityContext:
        # The image runs as uid 1000 ('nifi'). fsGroup makes the mounted
        # volumes writable by it - without this NiFi fails to start with
        # permission errors on its repositories.
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels: { app: nifi }
      terminationGracePeriodSeconds: 120
      containers:
        - name: nifi
          # 2.10.0 - current as of June 2026. Never <= 2.7.2 (CVE-2026-25903).
          image: mycompany.jfrog.io/docker-remote/apache/nifi:2.10.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8443,  name: https }
            - { containerPort: 11443, name: cluster }
            - { containerPort: 6342,  name: load-balance }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }

            # Kubernetes expands $(VAR) from earlier entries, which is how we
            # build the stable per-pod FQDN the cluster protocol needs.
            - name: NIFI_CLUSTER_ADDRESS
              value: "$(POD_NAME).nifi-headless.$(POD_NAMESPACE).svc.cluster.local"

            - { name: NIFI_CLUSTER_IS_NODE,            value: "true" }
            - { name: NIFI_CLUSTER_NODE_PROTOCOL_PORT, value: "11443" }
            - { name: NIFI_ZK_CONNECT_STRING,          value: "zookeeper:2181" }
            - { name: NIFI_ELECTION_MAX_WAIT,          value: "2 mins" }
            - { name: NIFI_ELECTION_MAX_CANDIDATES,    value: "2" }

            - { name: NIFI_WEB_HTTPS_PORT, value: "8443" }
            # EVERY hostname that may appear in a Host header. The ALB name and
            # your public hostname MUST be here or NiFi answers
            # "Invalid host header" to every request through the ingress.
            - name: NIFI_WEB_PROXY_HOST
              value: "nifi.example.com,nifi.example.com:443,localhost:8443,$(POD_NAME).nifi-headless.$(POD_NAMESPACE).svc.cluster.local:8443"

            - name: SINGLE_USER_CREDENTIALS_USERNAME
              valueFrom: { secretKeyRef: { name: nifi-credentials, key: single-user-username } }
            - name: SINGLE_USER_CREDENTIALS_PASSWORD
              valueFrom: { secretKeyRef: { name: nifi-credentials, key: single-user-password } }
            - name: NIFI_SENSITIVE_PROPS_KEY
              valueFrom: { secretKeyRef: { name: nifi-credentials, key: sensitive-props-key } }

            - { name: NIFI_JVM_HEAP_INIT, value: "3g" }
            - { name: NIFI_JVM_HEAP_MAX,  value: "3g" }

          resources:
            # Heap 3g + off-heap + OS overhead. Set requests == limits for
            # memory so the pod gets a Guaranteed QoS class and is not the
            # first thing evicted when the node is under pressure.
            requests: { cpu: "1",   memory: "5Gi" }
            limits:   { cpu: "2",   memory: "5Gi" }

          # NiFi takes 1-3 minutes to start. A startupProbe lets it take that
          # long WITHOUT a slack liveness threshold that would then be too
          # forgiving once it is running.
          startupProbe:
            httpGet: { path: /nifi-api/access/config, port: 8443, scheme: HTTPS }
            failureThreshold: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /nifi-api/access/config, port: 8443, scheme: HTTPS }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /nifi-api/access/config, port: 8443, scheme: HTTPS }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          volumeMounts:
            # Each repository gets its own volume. Content and provenance are
            # the IO-heavy ones; separating them stops them competing for IOPS,
            # which is the single biggest NiFi performance win.
            - { name: conf,        mountPath: /opt/nifi/nifi-current/conf }
            - { name: flowfile,    mountPath: /opt/nifi/nifi-current/flowfile_repository }
            - { name: content,     mountPath: /opt/nifi/nifi-current/content_repository }
            - { name: provenance,  mountPath: /opt/nifi/nifi-current/provenance_repository }
            - { name: database,    mountPath: /opt/nifi/nifi-current/database_repository }
            - { name: state,       mountPath: /opt/nifi/nifi-current/state }
            - { name: logs,        mountPath: /opt/nifi/nifi-current/logs }

  volumeClaimTemplates:
    - metadata: { name: conf }
      spec: { accessModes: ["ReadWriteOnce"], storageClassName: nifi-gp3, resources: { requests: { storage: 5Gi } } }
    - metadata: { name: flowfile }
      spec: { accessModes: ["ReadWriteOnce"], storageClassName: nifi-gp3, resources: { requests: { storage: 20Gi } } }
    - metadata: { name: content }
      spec: { accessModes: ["ReadWriteOnce"], storageClassName: nifi-gp3, resources: { requests: { storage: 100Gi } } }
    - metadata: { name: provenance }
      spec: { accessModes: ["ReadWriteOnce"], storageClassName: nifi-gp3, resources: { requests: { storage: 50Gi } } }
    - metadata: { name: database }
      spec: { accessModes: ["ReadWriteOnce"], storageClassName: nifi-gp3, resources: { requests: { storage: 10Gi } } }
    - metadata: { name: state }
      spec: { accessModes: ["ReadWriteOnce"], storageClassName: nifi-gp3, resources: { requests: { storage: 5Gi } } }
    - metadata: { name: logs }
      spec: { accessModes: ["ReadWriteOnce"], storageClassName: nifi-gp3, resources: { requests: { storage: 20Gi } } }
