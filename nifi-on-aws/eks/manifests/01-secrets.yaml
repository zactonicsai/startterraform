# ===========================================================================
#  EDIT THIS BEFORE APPLYING. These are placeholders.
#
#  For anything real, do NOT keep secrets in a manifest. Use the External
#  Secrets Operator or the AWS Secrets Store CSI driver so the values come
#  from AWS Secrets Manager and never sit in Git. Guide Chapter 12 shows how.
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: nifi-credentials
  namespace: nifi
type: Opaque
stringData:
  # NiFi rejects passwords under 12 characters at startup.
  single-user-username: "admin"
  single-user-password: "ChangeThisInEks123"

  # THE IMPORTANT ONE.
  # Encrypts sensitive values inside your flows. Must be identical on every
  # pod, and must survive upgrades. If you are migrating from an existing
  # NiFi, paste that instance's EXISTING key here or your encrypted flow
  # values will not decrypt.
  sensitive-props-key: "REPLACE-with-the-key-from-your-old-cluster"
---
apiVersion: v1
kind: Secret
metadata:
  name: artifactory-pull
  namespace: nifi
type: kubernetes.io/dockerconfigjson
stringData:
  # Generate the real thing with:
  #   kubectl -n nifi create secret docker-registry artifactory-pull \
  #     --docker-server=mycompany.jfrog.io \
  #     --docker-username=svc-nifi-puller \
  #     --docker-password='<token>' \
  #     --dry-run=client -o yaml > 01-secrets-pull.yaml
  .dockerconfigjson: |
    {"auths":{"mycompany.jfrog.io":{"username":"svc-nifi-puller","password":"REPLACE","auth":"REPLACE-base64-of-user:pass"}}}
